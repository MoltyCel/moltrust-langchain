[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "moltrust-langchain"
version = "0.1.1"
description = "MolTrust trust verification middleware for LangChain 1.x"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
license-files = []
authors = [{ name = "Lars Kersten Kroehl", email = "kersten.kroehl@cryptokri.ch" }]
keywords = ["langchain", "moltrust", "agent", "trust", "middleware", "ai-agents", "guardrail"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = [
  "langchain>=1.3",
  "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://moltrust.ch"
Repository = "https://github.com/MoltyCel/moltrust-langchain"
Issues = "https://github.com/MoltyCel/moltrust-langchain/issues"

[tool.hatch.build.targets.wheel]
packages = ["moltrust_langchain"]
